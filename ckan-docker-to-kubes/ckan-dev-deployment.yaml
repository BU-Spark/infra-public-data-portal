apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.dev.yml -o ../ckan-docker-to-kubes/
    kompose.version: 1.36.0 (ae2a39403)
  labels:
    io.kompose.service: ckan-dev
  name: ckan-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ckan-dev
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.dev.yml -o ../ckan-docker-to-kubes/
        kompose.version: 1.36.0 (ae2a39403)
      labels:
        io.kompose.service: ckan-dev
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
          image: quay.io/buspark_test/spark-ckan:latest
          livenessProbe:
            exec:
              command:
                - wget
                - -qO
                - /dev/null
                - http://localhost:5000
          name: ckan
          ports:
            - containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/ckan
              name: ckan-storage
            - mountPath: /srv/app/config
              name: ckan-config
      restartPolicy: Always
      volumes:
        - name: ckan-storage
          persistentVolumeClaim:
            claimName: ckan-storage
        - name: ckan-config
          emptyDir: {}