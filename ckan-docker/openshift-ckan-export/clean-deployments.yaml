      name: db
    spec:
      progressDeadlineSeconds: 600
      replicas: 0
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          io.kompose.service: db
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
            kompose.cmd: kompose convert -f docker-compose.dev.yml -o ../ckan-docker-to-kubes/
            kompose.version: 1.36.0 (ae2a39403)
            kubectl.kubernetes.io/restartedAt: "2025-07-06T16:46:33+08:00"
          creationTimestamp: null
          labels:
            io.kompose.service: db
        spec:
          containers:
            - env:
                - name: DATASTORE_READONLY_PASSWORD
                  value: datastore
                - name: PGDATA
                  value: /var/lib/postgresql/data/db
                - name: POSTGRES_PASSWORD
                  value: ckan
              image: postgres:12
              imagePullPolicy: Always
              livenessProbe:
                exec:
                  command:
                    - pg_isready
                    - -U
                    - ckan
                failureThreshold: 3
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: db
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/lib/postgresql/data
                  name: pg-data
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
            - name: pg-data
              persistentVolumeClaim:
                claimName: pg-data
