apiVersion: v1
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      annotations:
        deployment.kubernetes.io/revision: "55"
        kompose.cmd: kompose convert -f docker-compose.dev.yml -o ../ckan-docker-to-kubes/
        kompose.version: 1.36.0 (ae2a39403)
        kubernetes.io/change-cause: oc set image deployment/ckan-dev ckan=quay.io/buspark_test/spark-ckan:latest --record=true
      labels:
        io.kompose.service: ckan-dev
      name: ckan-dev
    spec:
      progressDeadlineSeconds: 600
      replicas: 0
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          io.kompose.service: ckan-dev
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
            kompose.cmd: kompose convert -f docker-compose.dev.yml -o ../ckan-docker-to-kubes/
            kompose.version: 1.36.0 (ae2a39403)
            kubectl.kubernetes.io/restartedAt: "2025-07-06T23:22:49+08:00"
          creationTimestamp: null
          labels:
            io.kompose.service: ckan-dev
        spec:
          containers:
            - command:
                - /bin/sh
                - /srv/app/start_ckan.sh
              env:
                - name: CKAN__DATASTORE__READ_URL
                  value: postgresql://datastore_ro:datastore@db/datastore
                - name: CKAN__DATASTORE__WRITE_URL
                  value: postgresql://ckan:ckan@db/datastore
              envFrom:
                - configMapRef:
                    name: env
              image: quay.io/buspark_test/spark-ckan:latest
              imagePullPolicy: Always
              livenessProbe:
                exec:
                  command:
                    - wget
                    - -qO
                    - /dev/null
                    - http://localhost:5000
                failureThreshold: 3
                initialDelaySeconds: 120
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              name: ckan
              ports:
                - containerPort: 5000
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /api/3/action/status_show
                  port: 5000
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 2
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/lib/ckan
                  name: ckan-storage
                - mountPath: /srv/app/config
                  name: ckan-config
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
            - name: ckan-storage
              persistentVolumeClaim:
                claimName: ckan-storage
            - emptyDir: {}
              name: ckan-config
