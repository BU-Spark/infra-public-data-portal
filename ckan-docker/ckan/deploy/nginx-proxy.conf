pid /tmp/nginx.pid;

events {}

http {
    upstream ckan_upstream {
        server ckan-service:5000;
    }

    server {
        # OpenShift non-root containers listen on high ports
        listen 8080;

        # Proxy all root-path requests through to CKAN
        location / {
            proxy_pass         http://ckan_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering    off;
        }

        # Static file caching proxy
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
            proxy_pass         http://ckan_upstream;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_pragma;
            expires            max;
        }
    }
}
